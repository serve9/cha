<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Force Stream - Panel Administrador</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #101010;
            --neon-red: #ff1e38;
            --neon-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #999999;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px 20px;
        }

        .admin-box {
            max-width: 650px;
            margin: 0 auto 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h2 {
            color: var(--neon-cyan);
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0,229,255,0.3);
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            margin-top: 6px;
            background: #161616;
            border: 1px solid #2a2a2a;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            transition: 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0,229,255,0.3);
        }

        button {
            margin-top: 20px;
            width: 100%;
            background: linear-gradient(135deg, var(--neon-cyan), #0088cc);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(0,229,255,0.2);
        }

        button:hover {
            box-shadow: 0 0 25px rgba(0,229,255,0.5);
            transform: translateY(-2px);
        }

        #msg {
            margin-top: 15px;
            text-align: center;
            color: var(--neon-cyan);
            font-weight: bold;
            font-size: 14px;
        }
        
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161616;
            padding: 12px 15px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            transition: 0.2s;
        }

        .item-row:hover {
            border-color: #444;
        }

        .item-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-group button {
            width: auto;
            padding: 6px 14px;
            font-size: 12px;
            margin-top: 0;
            box-shadow: none;
        }

        .btn-edit {
            background: #ffbc00;
            color: #000;
        }

        .btn-edit:hover {
            background: #e0a800;
            box-shadow: 0 0 10px rgba(255,188,0,0.4);
        }

        .btn-delete {
            background: var(--neon-red);
            color: #fff;
        }

        .btn-delete:hover {
            background: #d9142b;
            box-shadow: 0 0 10px rgba(255,30,56,0.4);
        }

        .btn-cancel {
            background: #252525;
            color: #fff;
            border: 1px solid #444;
            display: none;
            margin-top: 10px;
            box-shadow: none;
        }

        .btn-cancel:hover {
            background: #333;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- FORMULARIO DE AGREGAR / EDITAR -->
    <div class="admin-box">
        <h2 id="formTitle">🛠️ Panel Administrador - X-Force Stream</h2>
        
        <input type="hidden" id="editId" value="">
        <input type="hidden" id="editCollection" value="">

        <label>Tipo de Contenido</label>
        <select id="contentType">
            <option value="channels">Canal de TV (en vivo)</option>
            <option value="movies">Película</option>
            <option value="series">Serie</option>
        </select>

        <label>Título</label>
        <input type="text" id="itemTitle" placeholder="Ej. Canal Deportivo o Nombre de Película">

        <label>Categoría</label>
        <input type="text" id="itemCategory" placeholder="Ej. Deportes, Acción, Noticias">

        <label>Año (Opcional)</label>
        <input type="text" id="itemYear" placeholder="2026">

        <label>URL de la Imagen (Póster)</label>
        <input type="text" id="itemImage" placeholder="https://...">

        <label>URL del Video (.m3u8, .mp4 o Bunny Stream)</label>
        <input type="text" id="itemVideo" placeholder="https://...">

        <label>Descripción</label>
        <textarea id="itemDescription" rows="3" placeholder="Sinopsis o detalles..."></textarea>

        <button id="saveBtn" onclick="saveItem()">Guardar en Firebase</button>
        <button id="cancelBtn" class="btn-cancel" onclick="resetForm()">Cancelar Edición</button>
        <p id="msg"></p>
    </div>

    <!-- SECCIÓN DE LISTADO Y GESTIÓN -->
    <div class="admin-box">
        <h2>📋 Contenido Actual en la Nube</h2>
        <label>Selecciona la categoría para ver:</label>
        <select id="viewType" onchange="loadAdminList()">
            <option value="channels">Canales de TV</option>
            <option value="movies">Películas</option>
            <option value="series">Series</option>
        </select>

        <div id="itemList" style="margin-top: 15px;">
            <!-- Aquí se listarán los elementos -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2Fxc-RHLbGgAnU6wvZseoidI5jluykVc",
            authDomain: "charly-stream.firebaseapp.com",
            projectId: "charly-stream",
            storageBucket: "charly-stream.firebasestorage.app",
            messagingSenderId: "500209886393",
            appId: "1:500209886393:web:78322ba82a08ee130ee768"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveItem = async function() {
            const editId = document.getElementById("editId").value;
            const type = document.getElementById("contentType").value;
            const title = document.getElementById("itemTitle").value.trim();
            const category = document.getElementById("itemCategory").value.trim();
            const year = document.getElementById("itemYear").value.trim();
            const image = document.getElementById("itemImage").value.trim();
            const video = document.getElementById("itemVideo").value.trim();
            const description = document.getElementById("itemDescription").value.trim();
            const msg = document.getElementById("msg");

            if (!title || !video) {
                alert("El título y la URL del video son obligatorios.");
                return;
            }

            const itemData = {
                title,
                category: category || "General",
                year: year || "2026",
                image: image || "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80",
                video,
                description: description || ""
            };

            try {
                if (editId) {
                    msg.textContent = "Actualizando en la nube...";
                    const editCollection = document.getElementById("editCollection").value;
                    
                    if (editCollection !== type) {
                        await deleteDoc(doc(db, editCollection, editId));
                        await addDoc(collection(db, type), itemData);
                    } else {
                        await updateDoc(doc(db, type, editId), itemData);
                    }

                    msg.textContent = "✓ ¡Actualizado correctamente!";
                    resetForm();
                } else {
                    msg.textContent = "Guardando en la nube...";
                    await addDoc(collection(db, type), itemData);
                    msg.textContent = "✓ ¡Agregado correctamente a Firebase!";
                    document.getElementById("itemTitle").value = "";
                    document.getElementById("itemVideo").value = "";
                    document.getElementById("itemDescription").value = "";
                }

                loadAdminList();
            } catch (e) {
                console.error("Error al guardar: ", e);
                msg.textContent = "✗ Error al guardar el contenido.";
            }
        }

        window.editItem = async function(type, id) {
            try {
                const docSnap = await getDoc(doc(db, type, id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    document.getElementById("editId").value = id;
                    document.getElementById("editCollection").value = type;
                    document.getElementById("contentType").value = type;
                    document.getElementById("itemTitle").value = data.title || "";
                    document.getElementById("itemCategory").value = data.category || "";
                    document.getElementById("itemYear").value = data.year || "";
                    document.getElementById("itemImage").value = data.image || "";
                    document.getElementById("itemVideo").value = data.video || "";
                    document.getElementById("itemDescription").value = data.description || "";

                    document.getElementById("formTitle").textContent = "✏️ Editar Contenido - X-Force Stream";
                    document.getElementById("saveBtn").textContent = "Actualizar en Firebase";
                    document.getElementById("cancelBtn").style.display = "block";
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (e) {
                console.error("Error al cargar para editar:", e);
                alert("No se pudo cargar el elemento.");
            }
        }

        window.resetForm = function() {
            document.getElementById("editId").value = "";
            document.getElementById("editCollection").value = "";
            document.getElementById("formTitle").textContent = "🛠️ Panel Administrador - X-Force Stream";
            document.getElementById("saveBtn").textContent = "Guardar en Firebase";
            document.getElementById("cancelBtn").style.display = "none";
            document.getElementById("itemTitle").value = "";
            document.getElementById("itemVideo").value = "";
            document.getElementById("itemDescription").value = "";
            document.getElementById("msg").textContent = "";
        }

        window.loadAdminList = async function() {
            const type = document.getElementById("viewType").value;
            const container = document.getElementById("itemList");
            container.innerHTML = "Cargando contenido...";

            try {
                const querySnapshot = await getDocs(collection(db, type));
                let html = "";

                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='color: var(--text-muted); font-size: 14px;'>No hay elementos registrados en esta categoría.</p>";
                    return;
                }

                querySnapshot.forEach((documentSnapshot) => {
                    const item = documentSnapshot.data();
                    const id = documentSnapshot.id;

                    html += `
                        <div class="item-row">
                            <span class="item-title">${item.title}</span>
                            <div class="btn-group">
                                <button class="btn-edit" onclick="editItem('${type}', '${id}')">Editar</button>
                                <button class="btn-delete" onclick="deleteItem('${type}', '${id}')">Eliminar</button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (e) {
                console.error("Error al cargar la lista: ", e);
                container.innerHTML = "<p style='color: var(--neon-red);'>Error al cargar los datos.</p>";
            }
        }

        window.deleteItem = async function(type, id) {
            if (confirm("¿Estás seguro de que deseas eliminar este contenido?")) {
                try {
                    await deleteDoc(doc(db, type, id));
                    alert("✓ Elemento eliminado correctamente.");
                    loadAdminList();
                } catch (e) {
                    console.error("Error al eliminar: ", e);
                    alert("✗ Hubo un error al intentar eliminar.");
                }
            }
        }

        window.onload = function() {
            loadAdminList();
        }
    </script>
</body>
</html>
