<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Force Stream - Panel Administrador</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #101010;
            --neon-red: #ff1e38;
            --neon-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #999999;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: Arial, Helvetica, sans-serif;
            padding: 30px 20px;
        }

        .admin-box {
            max-width: 650px;
            margin: 0 auto 30px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 14px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h2 {
            color: var(--neon-cyan);
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0,229,255,0.3);
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            margin-top: 6px;
            background: #161616;
            border: 1px solid #2a2a2a;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            transition: 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0,229,255,0.3);
        }

        button {
            margin-top: 20px;
            width: 100%;
            background: linear-gradient(135deg, var(--neon-cyan), #0088cc);
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(0,229,255,0.2);
        }

        button:hover {
            box-shadow: 0 0 25px rgba(0,229,255,0.5);
            transform: translateY(-2px);
        }

        #msg {
            margin-top: 15px;
            text-align: center;
            color: var(--neon-cyan);
            font-weight: bold;
            font-size: 14px;
        }
        
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161616;
            padding: 12px 15px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            transition: 0.2s;
            gap: 10px;
        }

        .item-row:hover {
            border-color: #444;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .item-left input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .item-title {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-group button {
            width: auto;
            padding: 6px 14px;
            font-size: 12px;
            margin-top: 0;
            box-shadow: none;
        }

        .btn-edit {
            background: #ffbc00;
            color: #000;
        }

        .btn-edit:hover {
            background: #e0a800;
        }

        .btn-delete {
            background: var(--neon-red);
            color: #fff;
        }

        .btn-delete:hover {
            background: #d9142b;
        }

        .btn-cancel {
            background: #252525;
            color: #fff;
            border: 1px solid #444;
            display: none;
            margin-top: 10px;
            box-shadow: none;
        }

        .batch-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .batch-actions button {
            margin-top: 0;
            padding: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- IMPORTADOR AUTOMÁTICO XTREAM CODES -->
    <div class="admin-box">
        <h2>📥 Conectar Proveedor IPTV (Xtream Codes)</h2>
        <p style="color:var(--text-muted); font-size:13px; margin-top:5px;">Sincroniza los canales de tu proveedor automáticamente.</p>
        
        <label>URL del Servidor</label>
        <input type="text" id="iptvServer" placeholder="Ej. http://1234.bo:25461">

        <label>Usuario</label>
        <input type="text" id="iptvUser" placeholder="Tu usuario">

        <label>Contraseña</label>
        <input type="text" id="iptvPass" placeholder="Tu contraseña">

        <button onclick="importXtreamCodes()" style="background: linear-gradient(135deg, #00ff66, #00aa44); color:#000;">Conectar y Sincronizar Canales</button>
        <p id="batchMsg" style="margin-top: 10px; text-align: center; color: var(--neon-cyan); font-size: 13px;"></p>
    </div>

    <!-- FORMULARIO DE AGREGAR / EDITAR INDIVIDUAL -->
    <div class="admin-box">
        <h2 id="formTitle">🛠️ Panel Administrador - X-Force Stream</h2>
        
        <input type="hidden" id="editId" value="">
        <input type="hidden" id="editCollection" value="">

        <label>Tipo de Contenido</label>
        <select id="contentType">
            <option value="channels">Canal de TV (en vivo)</option>
            <option value="movies">Película</option>
            <option value="series">Serie</option>
        </select>

        <label>Título</label>
        <input type="text" id="itemTitle" placeholder="Ej. Canal Deportivo o Nombre de Película">

        <label>Categoría</label>
        <input type="text" id="itemCategory" placeholder="Ej. Deportes, Acción, Noticias">

        <label>Año (Opcional)</label>
        <input type="text" id="itemYear" placeholder="2026">

        <label>URL de la Imagen (Póster)</label>
        <input type="text" id="itemImage" placeholder="https://...">

        <label>URL del Video (.m3u8, .mp4)</label>
        <input type="text" id="itemVideo" placeholder="https://...">

        <label>Descripción</label>
        <textarea id="itemDescription" rows="3" placeholder="Sinopsis o detalles..."></textarea>

        <button id="saveBtn" onclick="saveItem()">Guardar en Firebase</button>
        <button id="cancelBtn" class="btn-cancel" onclick="resetForm()">Cancelar Edición</button>
        <p id="msg"></p>
    </div>

    <!-- SECCIÓN DE LISTADO Y GESTIÓN MASIVA -->
    <div class="admin-box">
        <h2>📋 Gestión de Contenido en la Nube</h2>
        <label>Selecciona la categoría:</label>
        <select id="viewType" onchange="loadAdminList()">
            <option value="channels">Canales de TV</option>
            <option value="movies">Películas</option>
            <option value="series">Series</option>
        </select>

        <div class="batch-actions">
            <button class="btn-edit" onclick="toggleSelectAll()" style="background:#333; color:#fff; border:1px solid #555;">Seleccionar todo</button>
            <button class="btn-delete" onclick="deleteSelectedItems()">Eliminar seleccionados</button>
        </div>

        <div id="itemList" style="margin-top: 15px;">
            <!-- Elementos listados -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2Fxc-RHLbGgAnU6wvZseoidI5jluykVc",
            authDomain: "charly-stream.firebaseapp.com",
            projectId: "charly-stream",
            storageBucket: "charly-stream.firebasestorage.app",
            messagingSenderId: "500209886393",
            appId: "1:500209886393:web:78322ba82a08ee130ee768"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.importXtreamCodes = async function() {
            let server = document.getElementById("iptvServer").value.trim();
            const user = document.getElementById("iptvUser").value.trim();
            const pass = document.getElementById("iptvPass").value.trim();
            const batchMsg = document.getElementById("batchMsg");
            
            if(!server || !user || !pass) {
                alert("Completa servidor, usuario y contraseña.");
                return;
            }

            if(server.endsWith('/')) server = server.slice(0, -1);
            const m3uUrl = `${server}/get.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&type=m3u`;

            batchMsg.textContent = "Conectando al servidor...";

            try {
                const response = await fetch(m3uUrl);
                if (!response.ok) throw new Error("Credenciales inválidas.");
                
                const text = await response.text();
                const lines = text.split('\n');
                let currentChannel = {};
                let count = 0;

                batchMsg.textContent = "Sincronizando canales...";

                for(let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if(line.startsWith('#EXTINF:')) {
                        currentChannel = {};
                        const commaIndex = line.lastIndexOf(',');
                        if(commaIndex !== -1) currentChannel.title = line.substring(commaIndex + 1).trim();
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        currentChannel.image = logoMatch ? logoMatch[1] : "https://images.unsplash.com/photo-1593784991095-a205069470b6?auto=format&fit=crop&w=500&q=80";
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        currentChannel.category = groupMatch ? groupMatch[1] : "TV en vivo";
                        currentChannel.year = "2026";
                        currentChannel.description = "Canal sincronizado";
                    } else if(line && !line.startsWith('#')) {
                        currentChannel.video = line;
                        if(currentChannel.title && currentChannel.video) {
                            await addDoc(collection(db, "channels"), {
                                title: currentChannel.title,
                                category: currentChannel.category,
                                year: currentChannel.year,
                                image: currentChannel.image,
                                video: currentChannel.video,
                                description: currentChannel.description
                            });
                            count++;
                        }
                    }
                }

                batchMsg.textContent = `✓ ¡Sincronizados ${count} canales!`;
                document.getElementById("iptvServer").value = "";
                document.getElementById("iptvUser").value = "";
                document.getElementById("iptvPass").value = "";
                loadAdminList();
            } catch (e) {
                console.error(e);
                batchMsg.textContent = "✗ Error de conexión o CORS en el servidor.";
            }
        }

        window.saveItem = async function() {
            const editId = document.getElementById("editId").value;
            const type = document.getElementById("contentType").value;
            const title = document.getElementById("itemTitle").value.trim();
            const category = document.getElementById("itemCategory").value.trim();
            const year = document.getElementById("itemYear").value.trim();
            const image = document.getElementById("itemImage").value.trim();
            const video = document.getElementById("itemVideo").value.trim();
            const description = document.getElementById("itemDescription").value.trim();
            const msg = document.getElementById("msg");

            if (!title || !video) {
                alert("Título y URL de video obligatorios.");
                return;
            }

            const itemData = {
                title,
                category: category || "General",
                year: year || "2026",
                image: image || "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80",
                video,
                description: description || ""
            };

            try {
                if (editId) {
                    msg.textContent = "Actualizando...";
                    const editCollection = document.getElementById("editCollection").value;
                    
                    if (editCollection !== type) {
                        await deleteDoc(doc(db, editCollection, editId));
                        await addDoc(collection(db, type), itemData);
                    } else {
                        await updateDoc(doc(db, type, editId), itemData);
                    }

                    msg.textContent = "✓ ¡Actualizado!";
                    resetForm();
                } else {
                    msg.textContent = "Guardando...";
                    await addDoc(collection(db, type), itemData);
                    msg.textContent = "✓ ¡Guardado en Firebase!";
                    resetForm();
                }
                loadAdminList();
            } catch (e) {
                console.error(e);
                msg.textContent = "✗ Error al guardar.";
            }
        }

        window.editItem = async function(type, id) {
            try {
                const docSnap = await getDoc(doc(db, type, id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("editId").value = id;
                    document.getElementById("editCollection").value = type;
                    document.getElementById("contentType").value = type;
                    document.getElementById("itemTitle").value = data.title || "";
                    document.getElementById("itemCategory").value = data.category || "";
                    document.getElementById("itemYear").value = data.year || "";
                    document.getElementById("itemImage").value = data.image || "";
                    document.getElementById("itemVideo").value = data.video || "";
                    document.getElementById("itemDescription").value = data.description || "";

                    document.getElementById("formTitle").textContent = "✏️ Editar Contenido";
                    document.getElementById("saveBtn").textContent = "Actualizar en Firebase";
                    document.getElementById("cancelBtn").style.display = "block";
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (e) {
                console.error(e);
            }
        }

        window.resetForm = function() {
            document.getElementById("editId").value = "";
            document.getElementById("editCollection").value = "";
            document.getElementById("formTitle").textContent = "🛠️ Panel Administrador - X-Force Stream";
            document.getElementById("saveBtn").textContent = "Guardar en Firebase";
            document.getElementById("cancelBtn").style.display = "none";
            document.getElementById("itemTitle").value = "";
            document.getElementById("itemCategory").value = "";
            document.getElementById("itemYear").value = "";
            document.getElementById("itemImage").value = "";
            document.getElementById("itemVideo").value = "";
            document.getElementById("itemDescription").value = "";
            document.getElementById("msg").textContent = "";
        }

        window.loadAdminList = async function() {
            const type = document.getElementById("viewType").value;
            const container = document.getElementById("itemList");
            container.innerHTML = "Cargando...";

            try {
                const querySnapshot = await getDocs(collection(db, type));
                let html = "";

                if (querySnapshot.empty) {
                    container.innerHTML = "<p style='color: var(--text-muted); font-size: 14px;'>No hay elementos.</p>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;
                    html += `
                        <div class="item-row">
                            <div class="item-left">
                                <input type="checkbox" class="item-checkbox" data-id="${id}" data-type="${type}">
                                <span class="item-title">${item.title}</span>
                            </div>
                            <div class="btn-group">
                                <button class="btn-edit" onclick="editItem('${type}', '${id}')">Editar</button>
                                <button class="btn-delete" onclick="deleteItem('${type}', '${id}')">Eliminar</button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (e) {
                console.error(e);
                container.innerHTML = "<p style='color: var(--neon-red);'>Error al cargar.</p>";
            }
        }

        window.toggleSelectAll = function() {
            const checkboxes = document.querySelectorAll(".item-checkbox");
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        window.deleteItem = async function(type, id) {
            if (confirm("¿Deseas eliminar este elemento?")) {
                try {
                    await deleteDoc(doc(db, type, id));
                    loadAdminList();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        window.deleteSelectedItems = async function() {
            const checkboxes = document.querySelectorAll(".item-checkbox:checked");
            if (checkboxes.length === 0) {
                alert("Selecciona al menos un elemento.");
                return;
            }
            if (confirm(`¿Eliminar ${checkboxes.length} elementos seleccionados?`)) {
                try {
                    for (const cb of checkboxes) {
                        const id = cb.getAttribute("data-id");
                        const type = cb.getAttribute("data-type");
                        await deleteDoc(doc(db, type, id));
                    }
                    alert("✓ Eliminados correctamente.");
                    loadAdminList();
                } catch (e) {
                    console.error(e);
                    alert("Error al eliminar los elementos.");
                }
            }
        }

        window.onload = function() {
            loadAdminList();
        }
    </script>
</body>
</html>
